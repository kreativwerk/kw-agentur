<!DOCTYPE html>
<!-- Root-Weiterleitung für statisches Hosting (IONOS): auf Node-Hosting
     übernimmt src/proxy.ts diese Aufgabe, bevor diese Datei greift. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Kreativwerk</title>
  <meta http-equiv="refresh" content="0; url=/de/">
  <script>
    location.replace(
      navigator.language && navigator.language.toLowerCase().indexOf("en") === 0
        ? "/en/"
        : "/de/"
    );
  </script>
  <style>
    body { background:#0b0b0c; color:#f5f4f0; font-family:system-ui,sans-serif;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    a { color:#ff4d00; font-weight:600; }
  </style>
</head>
<body>
  <a href="/de/">Weiter zu kw-agentur.de →</a>
</body>
</html>
